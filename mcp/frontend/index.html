<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>Overleaf Resume Tailor</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<div class="container">
		<h1>Overleaf Resume Tailor</h1>

		<label>Overleaf project link (required)</label>
		<input id="overleaf_link" placeholder="https://www.overleaf.com/project/<id>" required />

		<label>Target LaTeX file</label>
		<input id="target_file" placeholder="resume.tex" value="resume.tex" required />

		<label>Job Description (paste)</label>
		<textarea id="jd" placeholder="Paste Job Description here..."></textarea>

		<div style="display:flex;gap:8px;margin-top:8px">
			<button id="btn-generate">Generate</button>
			<button id="btn-sync">Sync to Overleaf (if configured)</button>
		</div>

		<h3>Generated LaTeX</h3>
		<textarea id="latex_output" rows="12" style="width:100%"></textarea>

		<h3>Chat (ask for tweaks)</h3>
		<div style="display:flex;gap:8px">
			<input id="chat_msg" placeholder="Make bullet points shorter" style="flex:1" />
			<button id="btn-chat">Send</button>
		</div>
		<pre id="chat_response" class="answer">Chat suggestions appear here.</pre>

	</div>
	<script src="script.js"></script>
</body>
</html>
